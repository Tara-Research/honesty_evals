# LLM-judge settings shared by every eval's judge stage.
# The judge is a LOCAL vLLM model running on the job's GPUs — no external API.
llm_judge_defaults:
  model: "openai/gpt-oss-120b"
  temperature: 1.0
  top_p: 1.0
  max_tokens: 8192
  min_tokens: 1
  reasoning_effort: "high"
  tensor_parallel_size: 4
  gpu_memory_utilization: 0.7
  max_model_len: 16384

# Paths relative to the repo root.
system_prompt_paths:
  honesty_universal: "honesty_evals/core/judge/prompts/honesty_universal.yaml"
  coherence: "honesty_evals/core/judge/prompts/coherence.yaml"
