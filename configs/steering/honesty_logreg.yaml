  # Keys mirror the canonical mode name (src/utils/feature_modes.SIX_MODES):
  #   {pos,neg}_emb_<mode>_path   — per-side embeddings for <mode>
  #   lr_{vector,bias}_<mode>_path — LR steering vector / bias for <mode>
