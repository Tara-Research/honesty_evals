# Among Us eval configuration: game settings.
#
# Ported from persona_playground src/AmongUs/main.py's SEVEN_MEMBER_GAME
# defaults.

# Game-engine settings, passed straight to amongagents.envs.game.AmongUs.
# Keys mirror amongagents/envs/configs/game_config.py (SEVEN_MEMBER_GAME).
game:
  num_players: 7
  num_impostors: 2
  num_common_tasks: 1
  num_short_tasks: 1
  num_long_tasks: 1
  discussion_rounds: 3
  max_num_buttons: 2
  kill_cooldown: 3
  max_timesteps: 50
