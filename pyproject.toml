[project]
name = "honesty-evals"
version = "0.1.0"
description = "Honesty evaluations for LLMs: AmongUs, AuditBench, MASK, Emergent Misalignment, and the generalized honesty test — all served through stock vLLM."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Latest version available in the Alliance (tamia) wheelhouse; installs as
    # 0.25.0+computecanada there (the local suffix satisfies the pin) and from
    # PyPI elsewhere. Has qwen3_5 (first in 0.17.0), so Qwen3.6-27B serves.
    # vLLM has no Windows wheels; the CLI imports it lazily, so a Windows dev
    # box can still `pip install -e .` and run the CPU-only stages.
    "torch",
    "transformers",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "httpx",
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "tqdm",
    "peft",
    "python-dotenv",
    "huggingface_hub",
    "datasets",
    "networkx",
]

[project.optional-dependencies]
serve = [
    "vllm==0.25.0; sys_platform != 'win32'",
]
impossible-swebench = [
    "impossiblebench @ git+https://github.com/safety-research/impossiblebench@061dc3dce6a96ab6cf02a855157263033dcfa3ba",
    "inspect-evals>=0.15.0",
    "inspect-podman==0.1.2",
    "podman-compose==1.6.0",
]
dev = [
    "pytest",
]

[project.scripts]
honesty-evals = "honesty_evals.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["honesty_evals*"]

[tool.setuptools.package-data]
"honesty_evals.core.judge" = ["prompts/*.yaml"]
"honesty_evals.evals.impossible_swebench" = ["tasks/*.yml"]
