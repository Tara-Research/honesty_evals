[project]
name = "honesty-evals"
version = "0.1.0"
description = "Honesty evaluations for LLMs: AmongUs, AuditBench, MASK, Emergent Misalignment, and the generalized honesty test — all served through stock vLLM."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # vLLM has no Windows wheels; the CLI imports it lazily, so a Windows dev
    # box can still `pip install -e .` and run the CPU-only stages.
    "vllm==0.26.0; sys_platform != 'win32'",
    "torch",
    "transformers",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "httpx",
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "tqdm",
    "peft",
    "python-dotenv",
    "huggingface_hub",
    "datasets",
    "networkx",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
honesty-evals = "honesty_evals.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["honesty_evals*"]

[tool.setuptools.package-data]
"honesty_evals.core.judge" = ["prompts/*.yaml"]
